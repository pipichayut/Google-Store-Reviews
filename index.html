<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f8fb;color:#1b2533;display:flex;align-items:center;justify-content:center;padding:20px;border-top:4px solid #1a2b4a}
.box{width:100%;max-width:380px;background:#fff;border:1px solid #e2e6eb;border-radius:10px;box-shadow:0 4px 18px rgba(27,37,51,.08);padding:28px 28px 24px}
.eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#8a95a3;font-weight:600}
h1{font-size:21px;font-weight:600;color:#1a2b4a;margin:4px 0 4px}
p.sub{margin:0 0 20px;color:#5f6b7a;font-size:13.5px}
label{display:block;font-size:12.5px;font-weight:500;color:#5f6b7a;margin:12px 0 5px}
input{width:100%;font:inherit;font-size:14px;color:#1b2533;border:1px solid #cfd5dc;border-radius:7px;padding:9px 11px;background:#fff}
input:focus{outline:2px solid #2f6bdc;outline-offset:1px;border-color:#2f6bdc}
.pw{position:relative}
.pw input{padding-right:62px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:12px;border:0;background:none;color:#2f6bdc;cursor:pointer;padding:4px 6px}
.go{margin-top:20px;width:100%;font:inherit;font-weight:600;font-size:14.5px;color:#fff;background:#2f6bdc;border:0;border-radius:7px;padding:10px;cursor:pointer}
.go:disabled{opacity:.65;cursor:progress}
.msg{min-height:20px;margin-top:12px;font-size:13px}
.msg.err{color:#c23a25}
.msg.info{color:#5f6b7a}
.foot{margin-top:14px;font-size:11.5px;color:#8a95a3;line-height:1.5}
</style>
</head>

const $ = id => document.getElementById(id);
const SKEY = "grst-session-" + CFG.id;
const enc = new TextEncoder();
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
function say(t, cls){ const m=$("msg"); m.textContent=t; m.className="msg "+(cls||""); }

async function openWithKey(rawKey, user){
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(CFG.iv), additionalData:enc.encode("grst-v1")}, key, unb64(CFG.ct));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const signout = `<script>(function(){function add(){var a=document.getElementById("asof"); if(!a||document.getElementById("grstOut")) return; var d=document.createElement("div"); d.style.marginTop="4px"; d.innerHTML='Signed in as <b>${user.replace(/[^a-z0-9._@-]/gi,"")}</b> · <a href="#" id="grstOut" style="color:#2f6bdc">Sign out</a>'; a.appendChild(d); document.getElementById("grstOut").onclick=function(e){e.preventDefault(); try{sessionStorage.removeItem("${SKEY}");}catch(_){} location.replace(location.pathname);};} if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",add); else add(); setTimeout(add,300);})();<\/script>`;
  const page = html.replace(/<\/body>\s*<\/html>\s*$/i, signout + "</body></html>");
  document.open(); document.write(page); document.close();
}

async function signIn(user, pass){
  const h = hex(await crypto.subtle.digest("SHA-256", enc.encode(user)));
  const entry = CFG.users.find(x => x.h === h);
  if(!entry) throw new Error("bad");
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:unb64(entry.s), iterations:CFG.iter}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const raw = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(entry.i), additionalData:enc.encode(user)}, kek, unb64(entry.w));
  return raw;
}

$("show").onclick = () => { const p=$("p"); const s=p.type==="password"; p.type=s?"text":"password"; $("show").textContent=s?"Hide":"Show"; $("show").setAttribute("aria-label", s?"Hide password":"Show password"); };

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if(!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined"){ say("This browser cannot open the dashboard. Please use a recent Chrome, Edge, Safari or Firefox.", "err"); return; }
  const user = $("u").value.trim().toLowerCase(), pass = $("p").value;
  $("go").disabled = true; say("Checking…", "info");
  let raw;
  try { raw = await signIn(user, pass); }
  catch(_) { $("go").disabled = false; say("Wrong username or password.", "err"); $("p").select(); return; }
  try { sessionStorage.setItem(SKEY, JSON.stringify({k:b64(raw), u:user})); } catch(_) {}
  say("Opening the dashboard…", "info");
  try { await openWithKey(raw, user); } catch(err) { $("go").disabled = false; say("The dashboard could not be opened in this browser.", "err"); }
});

(async () => {
  // Same browser tab: reopen without asking again until the tab is closed or "Sign out" is used.
  try {
    const s = JSON.parse(sessionStorage.getItem(SKEY) || "null");
    if(s && s.k){ say("Opening the dashboard…", "info"); await openWithKey(unb64(s.k), s.u||""); return; }
  } catch(_) { try{ sessionStorage.removeItem(SKEY); }catch(__){} say(""); }
  $("u").focus();
})();
})();
</script>
